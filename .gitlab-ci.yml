stages:
  - build
  - trigger-agent
  - deploy

variables:
  # Agent config
  KUBE_CONTEXT: $CI_PROJECT_PATH:gitguardian
  # Note: GCP_PROJECT_ID, GCP_WORKLOAD_IDENTITY_PROVIDER, and GCP_SERVICE_ACCOUNT 
  # are injected directly from GitLab Settings > CI/CD > Variables.

# Job 1: Build & Push Backend Image to Google Artifact Registry
build-images:
  stage: build
  image: google/cloud-sdk:alpine
  services:
    - name: docker:24.0.5-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  id_tokens:
    GCP_OIDC_TOKEN:
      aud: https://iam.googleapis.com/$GCP_WORKLOAD_IDENTITY_PROVIDER
  before_script:
    - apk add --no-cache docker-cli
    # Authenticate to GCP using Workload Identity (No long-lived keys!)
    - echo ${GCP_OIDC_TOKEN} > /tmp/.gcp-oidc-token
    - gcloud iam workload-identity-pools create-cred-config ${GCP_WORKLOAD_IDENTITY_PROVIDER}
      --service-account="${GCP_SERVICE_ACCOUNT}"
      --output-file=/tmp/.gcp-credentials.json
      --credential-source-file=/tmp/.gcp-oidc-token
    - export GOOGLE_APPLICATION_CREDENTIALS=/tmp/.gcp-credentials.json
    - gcloud auth login --cred-file=/tmp/.gcp-credentials.json --quiet
    - gcloud config set project $GCP_PROJECT_ID
    - gcloud auth list
    - gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
  script:
    # Failsafe check
    - if [ -z "$GCP_PROJECT_ID" ] || [ "$GCP_PROJECT_ID" = "\$GCP_PROJECT_ID" ]; then echo "ERROR - GCP_PROJECT_ID is missing from GitLab CI Variables!"; exit 1; fi
    
    # Force lowercase for Docker compatibility
    - export PROJECT_LOWER=$(echo "$GCP_PROJECT_ID" | tr '[:upper:]' '[:lower:]')
    - export BACKEND_IMAGE="us-central1-docker.pkg.dev/${PROJECT_LOWER}/gitguardian/backend:$CI_COMMIT_SHORT_SHA"
    - export LATEST_IMAGE="us-central1-docker.pkg.dev/${PROJECT_LOWER}/gitguardian/backend:latest"
    
    # Build Backend
    - docker build -t $BACKEND_IMAGE -t $LATEST_IMAGE ./backend
    - docker push us-central1-docker.pkg.dev/${PROJECT_LOWER}/gitguardian/backend --all-tags
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# Job 2: Audit - Triggers the GitLab Agent to analyze Risk using Anthropic / Gemini
agent-risk-audit:
  stage: trigger-agent
  image: curlimages/curl:latest
  script:
    - |
      echo "Triggering GitGuardian AI Agent..."
      # NOTE: On the VERY FIRST push, this will fail because the backend isn't live.
      # That is OK - it's a demonstration of the "Fail-Safe" logic.
      curl -X POST "http://gitguardian-backend-svc.gitguardian-agent.svc.cluster.local/api/ai/analyze-risk" \
        -H "Content-Type: application/json" \
        -H "X-GitGuardian-Agent-Token: $GITLAB_AGENT_TOKEN" \
        -d '{
          "feature_key": "deployment_'$CI_COMMIT_SHORT_SHA'",
          "environment": "Production",
          "code_diff": "Commit '$CI_COMMIT_SHORT_SHA' - Automated Deployment Pipeline Trigger",
          "description": "Pre-deployment blast radius audit."
        }' || echo "AI Audit unreachable. This is expected on the VERY FIRST deployment."
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# Job 3: GitOps Sync via GitLab Agent for Kubernetes
deploy-to-gke:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  environment:
    name: production
  script:
    # Connect to the GitLab Agent (KUBE_CONTEXT)
    - kubectl config use-context $KUBE_CONTEXT
    
    # Apply the Green-Optimized Manifests
    - kubectl apply -f k8s/services.yaml
    - kubectl apply -f k8s/redis-deployment.yaml
    
    # Update deployments with the fresh image tags and Project ID
    - sed -i "s|YOUR_GCP_PROJECT_ID|$GCP_PROJECT_ID|g" k8s/backend-deployment.yaml
    - sed -i "s|latest|$CI_COMMIT_SHORT_SHA|g" k8s/backend-deployment.yaml
    - kubectl apply -f k8s/backend-deployment.yaml
    
    - kubectl rollout status deployment/gitguardian-backend -n gitguardian-agent
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
