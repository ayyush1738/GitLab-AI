apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitguardian-redis
  namespace: gitguardian-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitguardian-redis
  template:
    metadata:
      labels:
        app: gitguardian-redis
    spec:
      containers:
        - name: redis
          image: redis:alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: gitguardian-redis-svc
  namespace: gitguardian-agent
spec:
  selector:
    app: gitguardian-redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
  type: ClusterIP
