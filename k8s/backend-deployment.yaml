---
# Green Optimized Flask Backend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitguardian-backend
  namespace: gitguardian-agent
  labels:
    app: gitguardian-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitguardian-backend
  template:
    metadata:
      labels:
        app: gitguardian-backend
    spec:
      containers:
        - name: backend
          image: us-central1-docker.pkg.dev/adroit-agent-491312-g4/gitguardian/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: FLASK_ENV
              value: "production"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: gitguardian-secrets
                  key: secret-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gitguardian-secrets
                  key: database-url
            - name: FRONTEND_URL
              valueFrom:
                secretKeyRef:
                  name: gitguardian-secrets
                  key: frontend-url
            - name: BASE_URL
              valueFrom:
                secretKeyRef:
                  name: gitguardian-secrets
                  key: base-url
            - name: GITLAB_ID
              valueFrom:
                secretKeyRef:
                  name: gitguardian-secrets
                  key: gitlab-id
            - name: GITLAB_SECRET
              valueFrom:
                secretKeyRef:
                  name: gitguardian-secrets
                  key: gitlab-secret
            - name: GITLAB_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitguardian-secrets
                  key: gitlab-agent-token
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gitguardian-secrets
                  key: google-api-key
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gitguardian-secrets
                  key: anthropic-api-key
          # ðŸŒ¿ RESOURCE BUDGET: Capped to 256Mi RAM and 200m CPU (Green Software Prize Alignment)
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /api/ai/agent-status
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/ai/agent-status
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
